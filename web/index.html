<style>
/* Layout: one full-screen canvas (town / dungeon / boss room); classic JRPG command windows float over it. */
:root {
  --night: #0e0c16;        /* page + dungeon black */
  --window: #13183a;       /* command-window navy */
  --window-hi: #1d2558;    /* selected row */
  --frame: #f3ecda;        /* window border / text */
  --muted: #a3a8cc;        /* secondary text */
  --gold: #f2c14e;         /* gold, prices, highlights */
  --hp: #e5483c;           /* damage / danger */
  --ok: #6fd38a;           /* equipped / owned */
  --font: "DotGothic16", "Hiragino Kaku Gothic ProN", "Noto Sans JP", "Meiryo", sans-serif;
  color-scheme: dark;
}
html, body { height: 100%; }
body { background: var(--night); color: var(--frame); font-family: var(--font); overflow: hidden; touch-action: none; -webkit-user-select: none; user-select: none; }
#game { position: relative; height: 100%; margin: 0 auto; overflow: hidden; }
/* the world: a small pixel canvas the browser scales up (sharp pixels, no per-frame upscale copy); HUD and text on #cv above it */
#px { position: absolute; left: 0; top: 0; display: block; image-rendering: pixelated; image-rendering: crisp-edges; pointer-events: none; }
#cv { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
#safeProbe { position: absolute; visibility: hidden; pointer-events: none; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }

/* ---------- JRPG window ---------- */
.win { background: var(--window); border: 3px solid var(--frame); border-radius: 8px; box-shadow: 0 0 0 3px var(--window), 0 10px 30px rgba(0,0,0,.55); padding: 12px 14px; }
.win h2 { margin: 0 0 8px; font-size: 18px; font-weight: 400; letter-spacing: .06em; text-wrap: balance; }
.win p { margin: 0; line-height: 1.6; }
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
button:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }

/* town: arrow buttons beside the building (swipe also works) */
.nav { position: absolute; top: 46%; width: 40px; height: 56px; border: 2px solid rgba(243,236,218,.7); border-radius: 8px; background: rgba(19,24,58,.7); font-size: 18px; }
#navL { left: max(6px, env(safe-area-inset-left, 0px)); }
#navR { right: max(6px, env(safe-area-inset-right, 0px)); }
.nav:disabled { opacity: .25; }

/* modal panel */
#panelWrap { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; padding: max(14px, env(safe-area-inset-top, 0px)) max(14px, env(safe-area-inset-right, 0px)) max(14px, env(safe-area-inset-bottom, 0px)) max(14px, env(safe-area-inset-left, 0px)); background: rgba(5,4,12,.45); }
#panel { width: 100%; max-width: 420px; max-height: 86%; display: flex; flex-direction: column; }
/* inside a building: the room shows on top, the shop window fills the lower part */
#panelWrap.inside { align-items: flex-end; background: none; padding-bottom: calc(12px + env(safe-area-inset-bottom, 0px)); }
#panelWrap.inside #panel { max-height: 56%; }
#panelBody { overflow-y: auto; min-height: 0; display: flex; flex-direction: column; gap: 6px; -webkit-overflow-scrolling: touch; touch-action: pan-y; }
#panelFoot { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
.btn { border: 2px solid var(--frame); border-radius: 6px; padding: 8px 14px; font-size: 16px; background: var(--window); flex: 1 1 auto; min-width: 0; }
.btn.primary { background: var(--frame); color: var(--window); }
.btn:disabled { opacity: .4; cursor: default; }
.optg { margin-top: 10px; font-size: 14px; }
.ico { width: 32px; height: 32px; image-rendering: pixelated; image-rendering: crisp-edges; vertical-align: middle; flex: none; }
.slots { display: flex; flex-direction: column; gap: 8px; margin-top: 6px; }
.slot { display: flex; align-items: stretch; gap: 6px; }
.slotpick, .pickrow { flex: 1; min-width: 0; display: flex; align-items: center; gap: 10px; text-align: left; padding: 8px 10px; border: 2px solid rgba(243,236,218,.45); border-radius: 8px; background: rgba(255,255,255,.05); font-size: 16px; }
.slotpick:active, .pickrow:active { background: var(--window-hi); }
.slotpick.empty { border-style: dashed; color: var(--muted); }
.slotno { display: inline-grid; place-items: center; width: 36px; height: 36px; border-radius: 6px; background: rgba(255,255,255,.08); font-size: 18px; }
.sn { display: flex; flex-direction: column; min-width: 0; }
.sn small { font-size: 12px; color: var(--muted); line-height: 1.5; }
.sn .tag { margin-left: 6px; font-size: 11px; }
.slotnum { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; min-width: 56px; }
.slotnum b { font-weight: 400; font-size: 20px; color: var(--ok); }
.slotnum .sbtn { width: 48px; padding: 2px 0; }
.picklist { display: flex; flex-direction: column; gap: 6px; }
.pickrow:disabled { opacity: .35; }
#tray button.trow { grid-template-columns: auto 1fr auto; column-gap: 8px; }
#tray button.trow .ico { grid-row: 1 / span 2; width: 30px; height: 30px; }
#tray button.trow b { grid-column: 3; grid-row: 1 / span 2; }
#tray button.trow > span { grid-column: 2; }
.optg .tabs { margin-top: 4px; }
.optn { display: block; font-size: 12px; color: var(--muted); margin-top: 3px; }
.row { display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 4px 10px; padding: 8px 6px; border-bottom: 1px dashed rgba(243,236,218,.22); }
.row:last-child { border-bottom: 0; }
.row .nm { font-size: 16px; min-width: 0; }
.row .sub { grid-column: 1 / 2; font-size: 13px; color: var(--muted); }
.row .act { grid-row: 1 / span 2; grid-column: 2; display: flex; flex-direction: column; align-items: flex-end; gap: 4px; }
.price { color: var(--gold); font-variant-numeric: tabular-nums; }
.tag { font-size: 13px; color: var(--ok); }
.sbtn { border: 2px solid var(--frame); border-radius: 5px; padding: 4px 12px; font-size: 14px; }
.sbtn:disabled { opacity: .35; }
.lock { opacity: .45; }
.gold { color: var(--gold); }
.hpc { color: var(--hp); }
.stat { display: grid; grid-template-columns: auto 1fr; gap: 4px 16px; font-size: 16px; font-variant-numeric: tabular-nums; }
.stat dt { color: var(--muted); }
.stat dd { margin: 0; text-align: right; }
.tabs { display: flex; gap: 6px; margin-bottom: 6px; }
.tabs button { flex: 1; border: 2px solid rgba(243,236,218,.35); border-radius: 5px; padding: 5px 0; font-size: 14px; }
.tabs button[aria-pressed="true"] { border-color: var(--frame); background: var(--window-hi); }
label.sl { display: grid; grid-template-columns: 5.5em 1fr; align-items: center; gap: 10px; font-size: 15px; }
input[type=range] { width: 100%; accent-color: var(--gold); }

/* in-dungeon buttons */
.hudBtn { position: absolute; border: 2px solid var(--frame); border-radius: 50%; background: rgba(19,24,58,.82); display: flex; align-items: center; justify-content: center; }
#pauseBtn { top: calc(8px + env(safe-area-inset-top, 0px)); right: max(8px, env(safe-area-inset-right, 0px)); width: 40px; height: 40px; font-size: 15px; }
#itemBtn { bottom: calc(14px + env(safe-area-inset-bottom, 0px)); right: max(12px, env(safe-area-inset-right, 0px)); width: 64px; height: 64px; flex-direction: column; font-size: 12px; line-height: 1.15; }
#itemBtn span { white-space: nowrap; font-size: 11px; }
/* item tray (game pauses while it is open) */
#tray { position: absolute; right: max(12px, env(safe-area-inset-right, 0px)); bottom: calc(88px + env(safe-area-inset-bottom, 0px)); width: min(250px, calc(100% - 24px)); padding: 6px; display: flex; flex-direction: column; gap: 4px; }
#tray button { display: grid; grid-template-columns: 1fr auto; grid-template-rows: auto auto; align-items: center; text-align: left; padding: 6px 10px; border-radius: 5px; font-size: 15px; }
#tray button:active { background: var(--window-hi); }
#tray button:disabled { opacity: .35; }
#tray button b { grid-row: 1 / span 2; grid-column: 2; font-weight: 400; color: var(--ok); }
#tray .tn { font-size: 12px; color: var(--muted); }
#tray .tclose { display: block; text-align: center; border-top: 1px dashed rgba(243,236,218,.3); border-radius: 0; color: var(--muted); }
#itemBtn b { font-size: 20px; font-weight: 400; color: var(--ok); }
/* 防衛戦: the whistle calls the three companions to where you are */
#whistleBtn { bottom: calc(92px + env(safe-area-inset-bottom, 0px)); right: max(16px, env(safe-area-inset-right, 0px)); width: 56px; height: 56px; flex-direction: column; font-size: 11px; line-height: 1.1; border-color: #ffe680; }
#whistleBtn b { font-size: 20px; font-weight: 400; color: #ffe680; }
#whistleBtn:active { background: rgba(80,70,20,.9); }
/* item cooldown: a dark sweep over the bag button that shrinks as it recharges */
#itemBtn::before { content: ""; position: absolute; inset: 0; border-radius: 50%; background: conic-gradient(rgba(5,4,12,.72) var(--cd, 0deg), transparent 0); pointer-events: none; }
#itemBtn.cool { border-color: var(--muted); }
#itemBtn.cool span, #itemBtn.cool b { opacity: .45; }
#itemCd { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-style: normal; font-size: 24px; color: var(--frame); text-shadow: 2px 2px 0 #000; pointer-events: none; }

/* title (指示: ロゴが いちばん目立つ。せつめいは なし) */
#title { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: space-between; text-align: center; padding: max(5vh, calc(env(safe-area-inset-top, 0px) + 18px)) max(16px, env(safe-area-inset-right, 0px)) max(5vh, calc(env(safe-area-inset-bottom, 0px) + 18px)) max(16px, env(safe-area-inset-left, 0px)); pointer-events: none; }
#title > * { pointer-events: auto; }
#title h1 { margin: 0; font-weight: 400; line-height: 1; display: flex; flex-direction: column; align-items: center; animation: logoIn .9s cubic-bezier(.2,1.4,.4,1) both; }
#title h1 .en { font-size: clamp(13px, 3.8vw, 18px); letter-spacing: .6em; margin-right: -.6em; color: #ffe9b0; text-shadow: 2px 2px 0 #3a0d0a; margin-bottom: 6px; }
#title h1 .jp1, #title h1 .jp2 { color: #ffd65a; -webkit-text-stroke: 3px #2a0c08; paint-order: stroke fill; letter-spacing: .02em; }
#title h1 .jp1 { font-size: clamp(36px, min(13.5vw, 8.5vh), 70px); text-shadow: 0 3px 0 #d0681c, 0 6px 0 #8a2a10, 0 9px 0 #2a0c08, 0 0 22px rgba(255,150,60,.55); }
#title h1 .jp2 { font-size: clamp(72px, min(29vw, 17vh), 150px); margin-top: -.04em; color: #fff0a8; text-shadow: 0 4px 0 #f0a02a, 0 8px 0 #c0501a, 0 12px 0 #7a1e0e, 0 16px 0 #2a0c08, 0 0 34px rgba(255,170,70,.7); animation: logoGlow 2.4s ease-in-out infinite; }
@keyframes logoIn { from { transform: translateY(-40px) scale(.7); opacity: 0; } }
@keyframes logoGlow { 50% { filter: brightness(1.12); } }
#title .start { font-size: 20px; padding: 12px 40px; flex: none; animation: blink 1.1s steps(2, start) infinite; }
@keyframes blink { 50% { border-color: transparent; } }
@media (prefers-reduced-motion: reduce) { #title .start, #title h1, #title h1 .jp2 { animation: none; } }
</style>

<div id="game">
  <canvas id="px" aria-hidden="true"></canvas>
  <canvas id="cv" aria-label="ゲーム画面"></canvas>
  <div id="safeProbe"></div>

  <button id="navL" class="nav" aria-label="ひだりの たてもの" hidden>◀</button>
  <button id="navR" class="nav" aria-label="みぎの たてもの" hidden>▶</button>

  <button id="pauseBtn" class="hudBtn" aria-label="ポーズ" hidden>II</button>
  <button id="itemBtn" class="hudBtn" aria-label="どうぐを使う" hidden><span>どうぐ</span><b id="itemCount">0</b><i id="itemCd" aria-hidden="true"></i></button>
  <button id="whistleBtn" class="hudBtn" aria-label="ふえを ふいて なかまを よぶ" hidden><b>♪</b><span>ふえ</span></button>
  <div id="tray" class="win" hidden></div>

  <div id="panelWrap" hidden>
    <div id="panel" class="win" role="dialog" aria-modal="true" aria-labelledby="panelTitle">
      <div id="facilityTabs" role="tablist" aria-label="施設の機能" hidden></div>
      <div class="panel-heading"><h2 id="panelTitle"></h2><button id="facilityHelp" class="sbtn" aria-label="施設の説明" hidden>？</button></div>
      <div id="panelBody"></div>
      <div id="panelFoot"></div>
    </div>
  </div>

  <div id="helpWrap" hidden>
    <div id="helpDialog" class="win" role="dialog" aria-modal="true" aria-labelledby="helpTitle">
      <h2 id="helpTitle"></h2><div id="helpBody"></div>
      <label id="helpRemember"><input id="helpHide" type="checkbox">次回から表示しない</label>
      <p id="helpError" role="alert"></p><button id="helpOK" class="btn primary">とじる</button>
    </div>
  </div>

  <div id="title">
    <h1 aria-label="ぶつかり勇者"><span class="en">BUMP HERO</span><span class="jp1">ぶつかり</span><span class="jp2">勇者</span></h1>
    <button class="btn start" id="startBtn">はじめる</button>
  </div>
</div>
