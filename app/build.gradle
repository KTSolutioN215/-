plugins {
    id 'com.android.application'
}

android {
    namespace 'com.ktsolution.butsukari'
    compileSdk 35

    defaultConfig {
        applicationId 'com.ktsolution.butsukari'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '1.0'
    }

    signingConfigs {
        // Fixed debug key committed to the repo so every CI build has the same signature
        // (lets you install updates over the previous version).
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        release {
            def ks = System.getenv('SIGNING_KEYSTORE_PATH')
            if (ks) {
                storeFile file(ks)
                storePassword System.getenv('SIGNING_STORE_PASSWORD')
                keyAlias System.getenv('SIGNING_KEY_ALIAS')
                keyPassword System.getenv('SIGNING_KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig System.getenv('SIGNING_KEYSTORE_PATH') ? signingConfigs.release : signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

// The game lives in /web (index.html is the page body, as published on claude.ai).
// Copy it into the APK assets and wrap the body in a full HTML document.
tasks.register('syncWeb') {
    def webDir = rootProject.file('web')
    def outDir = file('src/main/assets')
    inputs.dir webDir
    outputs.dir outDir
    doLast {
        outDir.mkdirs()
        webDir.eachFile { f -> if (f.name.endsWith('.js')) { new File(outDir, f.name).bytes = f.bytes } }
        def body = new File(webDir, 'index.html').getText('UTF-8')
        def head = '<!doctype html><html lang="ja"><head><meta charset="utf-8">' +
                '<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">' +
                '<style>:root{padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}body{margin:0}[hidden]{display:none!important}</style>' +
                '</head><body>'
        new File(outDir, 'index.html').setText(head + body + '</body></html>', 'UTF-8')
    }
}
preBuild.dependsOn 'syncWeb'
